# Builds the desktop apps (Windows installer + portable .exe, macOS .dmg, Linux .AppImage), smoke-tests each
# packaged app, and publishes them as a GitHub Release v<desktop/package.json version> — on a pushed v* tag, or when
# run manually (Actions → desktop → Run workflow), in which case the tag is created on the current commit.
name: desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm ci
        working-directory: desktop
      # Signing switches on only when these repository secrets exist (see SIGNING.md); otherwise macOS is ad-hoc signed.
      - run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
      - name: Signature report (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          for app in dist/mac*/YouPls.app; do codesign --verify --deep --strict "$app" && codesign -dv "$app" 2>&1 | grep -E "Signature|Authority|TeamIdentifier" ; done
      - name: Signature report (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object { "{0}: {1}" -f $_.Name, (Get-AuthenticodeSignature $_.FullName).Status }
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run --auto-servernum ./dist/*.AppImage --appimage-extract-and-run --smoke --no-sandbox
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/win-unpacked/YouPls.exe" -ArgumentList "--smoke" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test failed: $($p.ExitCode)" }
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          app=$(ls -d dist/mac*/YouPls.app | head -1)
          "$app/Contents/MacOS/YouPls" --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: youpls-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release tag
        run: echo "TAG=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "YouPls $TAG" --notes "YouPls desktop apps.

          - **Windows:** \`YouPls-Setup-*.exe\` (installer) or \`YouPls-Portable-*.exe\` (no installation).
          - **macOS:** \`YouPls-*-mac-arm64.dmg\` (Apple silicon) or \`-x64.dmg\` (Intel).
          - **Linux:** \`YouPls-*-linux-x64.AppImage\` (chmod +x, then run).

          **Easiest, with no security warnings:** open https://motqenacademy-droid.github.io/youpls/ in Edge or Chrome and click *Install app* — YouPls becomes a desktop app that works offline.

          Until the downloads are signed with a certificate: Windows SmartScreen may show *More info → Run anyway*; on macOS (ad-hoc signed) choose *System Settings → Privacy & Security → Open Anyway* the first time."
