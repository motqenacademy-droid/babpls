<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>BabPls</title>
  <!-- "Bab" (باب) is a door: a pointed-arch doorway opening onto a path model (two constructs → one), on a golden threshold -->
  <defs>
    <linearGradient id="bp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.5" stop-color="#3730a3"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="bp-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="bp-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="bp-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bp-bg)"/>
  <!-- doorway: pointed (Islamic) arch -->
  <path d="M136 418 V250 C136 178 196 128 256 86 C316 128 376 178 376 250 V418 Z" fill="url(#bp-door)" stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>
  <!-- path model inside the door -->
  <g stroke="#67e8f9" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M211 257 L224 276"/>
    <path d="M301 257 L288 276"/>
  </g>
  <g fill="#67e8f9">
    <path d="M238 298 L234 270 L213 285 Z"/>
    <path d="M274 298 L278 270 L299 285 Z"/>
  </g>
  <circle cx="190" cy="228" r="36" fill="url(#bp-node)"/>
  <circle cx="322" cy="228" r="36" fill="url(#bp-node)"/>
  <circle cx="256" cy="346" r="42" fill="url(#bp-node)"/>
  <circle cx="256" cy="346" r="16" fill="#3730a3"/>
  <!-- keystone and threshold -->
  <circle cx="256" cy="86" r="17" fill="url(#bp-gold)"/>
  <rect x="104" y="408" width="304" height="40" rx="14" fill="url(#bp-gold)"/>
</svg>
